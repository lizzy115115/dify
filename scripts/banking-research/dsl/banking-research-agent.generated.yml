      sourcePosition: right
      targetPosition: left
      data:
        title: 用户输入
        type: start
        desc: ''
        selected: false
        variables:
        - label: 投研问题
          variable: query
          type: paragraph
          required: true
          max_length: 2000
          options: []
    - id: '2000000000002'
      type: custom
      width: 244
      height: 120
      position:
        x: 300
        y: 300
      positionAbsolute:
        x: 300
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 参数提取
        type: parameter-extractor
        desc: 提取 ticker / 年份 / 报告期 / 行业
        selected: false
        query:
        - '2000000000001'
        - query
        reasoning_mode: prompt
        instruction: |-
          从投研问题中提取结构化参数。无则留空字符串。
          - ticker: 证券代码（A 股 6 位数字或 NVDA 等）
          - fiscal_year: 会计年度或自然年（如 2025、2026）
          - report_period: 报告期描述（2025年报、2026Q1、FY2026 10-K）
          - industry_hint: 行业关键词（白酒、光模块、AI算力等）
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.1
        parameters:
        - name: ticker
          type: string
          description: 证券代码，如 600519、688256、NVDA
          required: false
        - name: fiscal_year
          type: string
          description: 会计年度或自然年，如 2025、2026
          required: false
        - name: report_period
          type: string
          description: 报告期，如 2025年报、2026Q1、FY2026 10-K
          required: false
        - name: industry_hint
          type: string
          description: 行业关键词
          required: false
        vision:
          enabled: false
    - id: '2000000000003'
      type: custom
      width: 244
      height: 90
      position:
        x: 570
        y: 300
      positionAbsolute:
        x: 570
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 查询改写
        type: llm
        desc: 补全机构、报告期、指标，写入 ticker/年份
        selected: false
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.2
        prompt_template:
        - role: system
          text: |-
            你是华东投研中心的「检索查询改写」模块，服务于 hybrid + Rerank 多库知识检索。

            ## 任务
            将用户自然语言问题改写为适合向量+BM25混合检索的完整 query，并保留结构化检索线索。

            ## 元数据字段（入库时已写入，检索结果 segment 会携带）
            | 字段 | 含义 | 年份/版本如何区分 |
            |------|------|-------------------|
            | doc_kind | macro_report / industry_report / equity_report / filing / regulation / internal_report | 区分宏观、行业、个股、财报、监管 |
            | effective_date | 政策生效日或财报/公告**披露日**（ISO 日期） | **不是会计年度本身**；2025 年报常在 2026 年披露，需结合文件名与 report_period |
            | ticker | 证券代码（600519、688256、300502、NVDA 等） | 同一公司不同报告靠 effective_date + 报告期区分 |
            | industry | 行业标签 | 辅助行业库检索 |
            | is_valid | 1=现行有效，0=已废止 | 工作流检索层已强制 is_valid=1，禁止引用废止政策 |

            ## 改写规则
            1. 补全公司全称、证券代码 ticker、报告期（如 2025 年报 / 2026Q1 / FY2026 10-K）
            2. 保留原文数字、文号、政策名称、指标名（营收、净利润、资本开支等）
            3. 若参数提取节点给出 ticker / fiscal_year / report_period，必须写入改写 query
            4. 监管类问题保留「办法/通知/文号/生效日期」等关键词
            5. 只输出一行改写后的 query，不要解释、不要 Markdown
        - role: user
          text: |-
            【用户原问】{{#2000000000001.query#}}

            【参数提取】
            - ticker: {{#2000000000002.ticker#}}
            - fiscal_year: {{#2000000000002.fiscal_year#}}
            - report_period: {{#2000000000002.report_period#}}
            - industry_hint: {{#2000000000002.industry_hint#}}

            请输出改写 query。
        context:
          enabled: false
          variable_selector: []
        variables: []
        vision:
          enabled: false
