          2 财报公告 — 年报、季报、10-K、业绩快报、公告
          3 个股研报 — 券商点评、目标价、投资评级
          4 宏观行业 — 宏观策略、行业深度、产业趋势
          5 综合投研 — 跨库对比、多标的、无法单一归类
        classes:
        - id: '1'
          name: 监管政策问询
          label: 监管政策
        - id: '2'
