app:
  name: 投研知识库智能体
  description: 生产级投研 RAG：参数提取 → 查询改写 → 意图路由 → 分库 hybrid/Rerank + is_valid 元数据过滤 → 引用式回答
  icon: 📊
  icon_background: '#E4F2FF'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: |-
      华东投研知识库智能体（Milvus hybrid + Rerank + 元数据过滤）。
      回答仅含三章：结论摘要、依据与数据、元数据说明；资料不足时将直接说明无依据。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 2026年工信部75号人工智能科技伦理审查办法的核心要求是什么？
    - 贵州茅台600519 2026Q1报告里的营收和归母净利润是多少？
    - 贵州茅台600519 2025年年度报告摘要披露的关键财务指标有哪些？
    - 寒武纪688256 2026Q1季报营收与毛利率是多少？
    - 对比600519、300502、688256三家公司2026Q1业绩增速
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: '2000000000001'
      type: custom
      width: 244
      height: 90
      position:
        x: 30
        y: 300
      positionAbsolute:
        x: 30
        y: 300
