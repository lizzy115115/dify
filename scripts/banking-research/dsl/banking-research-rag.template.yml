app:
  description: 投研知识库 - 查询改写 + 多库 hybrid/Rerank + is_valid 元数据过滤
  icon: 📊
  icon_background: '#E4F2FF'
  mode: workflow
  name: 投研智能问答-hybrid
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-rewrite
      source: __START_ID__
      sourceHandle: source
      target: __REWRITE_ID__
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: knowledge-retrieval
      id: rewrite-retrieval
      source: __REWRITE_ID__
      sourceHandle: source
      target: __RETRIEVAL_ID__
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: retrieval-answer
      source: __RETRIEVAL_ID__
      sourceHandle: source
      target: __ANSWER_ID__
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: answer-end
      source: __ANSWER_ID__
      sourceHandle: source
      target: __END_ID__
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: 用户问题
          max_length: null
          options: []
          required: true
          type: text-input
          variable: query
      height: 90
      id: __START_ID__
      position:
        x: 30
        y: 280
      positionAbsolute:
        x: 30
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 补全机构名、报告期、关键指标
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: __LLM_MODEL__
          provider: __LLM_PROVIDER__
        prompt_template:
        - role: system
          text: |
            你是投研查询改写助手。将用户问题改写为适合知识库检索的完整 query。
            规则：
            1. 补全缺失的机构全称、报告期（如 2024Q3）、关键财务指标
            2. 保留原文中的数字、文号、政策名称
            3. 只输出改写后的 query，不要解释
        - role: user
          text: '{{#__START_ID__.query#}}'
        selected: false
        title: 查询改写
        type: llm
        variables: []
        vision:
          enabled: false
      height: 90
      id: __REWRITE_ID__
      position:
        x: 320
        y: 280
      positionAbsolute:
        x: 320
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids: __DATASET_IDS__
        desc: hybrid + Rerank + is_valid=1
        metadata_filtering_conditions:
          conditions:
          - comparison_operator: '='
            name: is_valid
            value: 1
          logical_operator: and
        metadata_filtering_mode: manual
        multiple_retrieval_config:
          reranking_enable: true
          reranking_mode: reranking_model
          reranking_model:
            model: __RERANK_MODEL__
            provider: __RERANK_PROVIDER__
          score_threshold: __SCORE_THRESHOLD__
          top_k: __TOP_K__
        query_variable_selector:
        - __REWRITE_ID__
        - text
        retrieval_mode: multiple
        selected: false
        title: 知识检索
        type: knowledge-retrieval
      height: 90
      id: __RETRIEVAL_ID__
      position:
        x: 610
        y: 280
      positionAbsolute:
        x: 610
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - __RETRIEVAL_ID__
          - result
        desc: 强制引用 segment_id，资料不足时明确说明
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: __LLM_MODEL__
          provider: __LLM_PROVIDER__
        prompt_template:
        - role: system
          text: |
            你是投研问答助手。仅依据检索到的知识库片段回答。
            规则：
            1. 每个事实必须标注来源 segment_id，格式 [segment_id:xxx]
            2. 资料不足以回答时，明确说「当前知识库未找到足够依据」
            3. 禁止引用 is_valid=0 或已废止政策（检索层已过滤，仍须自检）
            4. 数字、日期必须与片段一致，不可臆造
        - role: user
          text: |
            用户问题：{{#__START_ID__.query#}}
            改写 query：{{#__REWRITE_ID__.text#}}
            请基于检索结果回答。
        selected: false
        title: 生成回答
        type: llm
        variables: []
        vision:
          enabled: false
      height: 90
      id: __ANSWER_ID__
      position:
        x: 900
        y: 280
      positionAbsolute:
        x: 900
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - __ANSWER_ID__
          - text
          value_type: string
          variable: answer
        selected: false
        title: End
        type: end
      height: 90
      id: __END_ID__
      position:
        x: 1190
        y: 280
      positionAbsolute:
        x: 1190
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
